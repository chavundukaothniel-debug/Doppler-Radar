<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Doppler Radar System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/light-ui.css">
</head>
<body>
  <section id="loginView" class="login-view">
    <form id="loginForm" class="login-card">
      <div class="radar-mark" aria-hidden="true"></div>
      <p class="eyebrow">SECURE MONITORING PORTAL</p>
      <h1>Doppler Radar System</h1>
      <p class="login-copy">Sign in to monitor live human-movement telemetry and security alerts.</p>
      <label class="field"><span>USERNAME</span><input name="username" autocomplete="username" required></label>
      <label class="field"><span>PASSWORD</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button primary" type="submit">Sign in</button>
      <p id="loginError" class="form-error" role="alert"></p>
    </form>
  </section>
  <div id="app" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-glyph">DR</span><span>DOPPLER RADAR<small>HUMAN MOVEMENT MONITORING</small></span></div>
      <nav id="navigation" class="navigation" aria-label="Primary navigation"></nav>
      <div class="sidebar-footer"><strong id="accountName">USER</strong><span id="accountRole">Viewer</span><button id="themeToggle" class="text-button" type="button">Dark mode</button><button id="logoutButton" class="text-button" type="button">Sign out</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div><p id="pageEyebrow" class="eyebrow">LIVE TELEMETRY</p><h1 id="pageTitle">Dashboard</h1></div><div class="topbar-right"><span id="connectionStatus" class="status-chip offline">ESP32 OFFLINE</span><time id="clock" class="clock"></time></div></header>
      <div id="telemetryNotice" class="telemetry-notice hidden"></div>
      <div id="content" class="content" aria-live="polite"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/light-ui.js" defer></script>
</body>
</html>
